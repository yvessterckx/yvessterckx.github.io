<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yves Games</title>
<meta name="description" content="Small browser games by Yves: a cat climbing curtains and a Halloween pumpkin-carving toy. Free to play, no install.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d4aff'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#14111f;--bar:#1b1730;--card:#221c38;--line:#363052;--text:#f1eefb;--muted:#bab3d1;--chip:#312a4e;--chipt:#d9d2f2;--acc:#a58bff;--warm:#ffb454;--shadow:rgba(0,0,0,.45)}
@media (prefers-color-scheme:light){:root{--bg:#f4f1fb;--bar:#fff;--card:#fff;--line:#d9d3ec;--text:#1d1830;--muted:#554d70;--chip:#ebe6f8;--chipt:#3b3160;--acc:#5b3fd6;--warm:#c2410c;--shadow:rgba(40,30,80,.18)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
header{background:var(--bar);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem}
.bar svg{width:28px;height:28px;flex:none}
main{max-width:1200px;margin:0 auto;padding:28px 16px 48px}
h1{margin:0 0 20px;font-size:1.6rem;line-height:1.2}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));list-style:none;margin:0;padding:0}
.tile{display:block;color:inherit;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile:hover{transform:translateY(-4px);border-color:var(--warm);box-shadow:0 10px 24px var(--shadow)}
.tile:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.tile img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--chip);border-radius:16px 16px 0 0}
.info{padding:14px 16px 16px}
.info h2{margin:0 0 4px;font-size:1.2rem}
.info p{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--chip);color:var(--chipt);border-radius:999px;padding:2px 10px;font-size:.8rem}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
</head>
<body>
<header><div class="bar"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#6d4aff"/><path d="M12 9l11 7-11 7z" fill="#fff"/></svg><span>Yves Games</span></div></header>
<main>
<h1>Games</h1>
<ul class="grid" id="grid">
</ul>
<noscript><p>Play: <a href="curtain-climber/">Curtain Climber</a> | <a href="hollowed/">Hollowed</a></p></noscript>
</main>
<script>
// To add a game: append one object here.
var GAMES=[
{href:"curtain-climber/",img:"assets/curtain-climber.png",title:"Curtain Climber",desc:"A cat at home climbs the curtains, then runs agility courses in a dream.",tags:["Cat parkour","3D","Agility"]},
{href:"hollowed/",img:"assets/hollowed.svg",title:"Hollowed",desc:"Pick a pumpkin, carve a face, light the candle and watch it glow.",tags:["Carving","3D","Halloween"]}
];
var g=document.getElementById("grid");
GAMES.forEach(function(x){
var li=document.createElement("li"),a=document.createElement("a"),im=document.createElement("img"),d=document.createElement("div"),h=document.createElement("h2"),p=document.createElement("p"),t=document.createElement("div");
a.className="tile";a.href=x.href;im.src=x.img;im.alt="";im.loading="lazy";im.width=800;im.height=500;
d.className="info";h.textContent=x.title;p.textContent=x.desc;t.className="tags";
x.tags.forEach(function(s){var e=document.createElement("span");e.textContent=s;t.appendChild(e)});
d.append(h,p,t);a.append(im,d);li.appendChild(a);g.appendChild(li)});
</script>
</body>
</html>
